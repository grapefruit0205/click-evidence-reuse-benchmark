name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_repository:
        description: Public GitHub repository to evaluate (OWNER/REPO)
        required: true
        default: grapefruit0205/click
      target_ref:
        description: Branch, tag, or commit to evaluate
        required: true
        default: e6f9f3ee0b2749660d1603af74be40a36af93f40
      suite:
        description: Benchmark suite or group to run
        required: true
        type: choice
        default: safety-and-efficiency-200
        options:
          - dependency-omission-100
          - unnecessary-rerun-100
          - safety-and-efficiency-200
          - evidence-reuse-500
          - all

permissions:
  contents: read

jobs:
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CLICK_BENCH_TARGET_REPOSITORY: ${{ inputs.target_repository || 'grapefruit0205/click' }}
      CLICK_BENCH_TARGET_REF: ${{ inputs.target_ref || 'e6f9f3ee0b2749660d1603af74be40a36af93f40' }}
    steps:
      - name: Check out benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile benchmark sources
        run: python -m compileall -q benchmarks tests run_benchmark.py
      - name: Run benchmark regression tests
        run: python run_benchmark.py --tests

  full-matrix:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'evidence-reuse-500' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    env:
      CLICK_BENCH_TARGET_REPOSITORY: ${{ inputs.target_repository || 'grapefruit0205/click' }}
      CLICK_BENCH_TARGET_REF: ${{ inputs.target_ref || 'e6f9f3ee0b2749660d1603af74be40a36af93f40' }}
    steps:
      - name: Check out benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run all 500 controlled cases
        run: python run_benchmark.py -- --fail-on-unsafe

  dependency-omission:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'dependency-omission-100' || inputs.suite == 'safety-and-efficiency-200' || inputs.suite == 'all'))
    runs-on: ubuntu-latest
    env:
      CLICK_BENCH_TARGET_REPOSITORY: ${{ inputs.target_repository || 'grapefruit0205/click' }}
      CLICK_BENCH_TARGET_REF: ${{ inputs.target_ref || 'e6f9f3ee0b2749660d1603af74be40a36af93f40' }}
    steps:
      - name: Check out benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run 100 dependency-omission cases
        run: python run_benchmark.py --suite dependency-omission-100 -- --fail-on-unsafe --fail-on-oracle-mismatch

  unnecessary-rerun:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'unnecessary-rerun-100' || inputs.suite == 'safety-and-efficiency-200' || inputs.suite == 'all'))
    runs-on: ubuntu-latest
    env:
      CLICK_BENCH_TARGET_REPOSITORY: ${{ inputs.target_repository || 'grapefruit0205/click' }}
      CLICK_BENCH_TARGET_REF: ${{ inputs.target_ref || 'e6f9f3ee0b2749660d1603af74be40a36af93f40' }}
    steps:
      - name: Check out benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run 100 unnecessary-rerun cases
        run: python run_benchmark.py --suite unnecessary-rerun-100 -- --fail-on-unnecessary-rerun --fail-on-oracle-mismatch
